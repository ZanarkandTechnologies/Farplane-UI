kind = "project-automations"
status = "active"
project = "Farplane UI"
created_at = "2026-06-17"
updated_at = "2026-07-02"
framework_template_version = "0.6.0"
owner = "automation-advisor"
source_of_truth = [
  "farplane/harness.md",
  "farplane/products.md",
  "farplane/pm.json",
]

[[automations]]
id = "farplane-ui-pulse"
name = "Farplane UI Pulse"
kind = "heartbeat"
status = "active"
prompt = '''
Use $pulse-update.

Run one Farplane UI Pulse beat.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane-UI"

Reads:
- farplane/harness.md to preserve the static human thesis and authority boundaries.
- farplane/products.md when shaping product refill tickets.

Overrides:
- product refill tickets should name the project type, baseline or comparison point, expected artifact, and proof signal.
- distribution/content tickets are allowed when they showcase a real Farplane UI product row or feature and name a feedback signal.
- favor local ready/unblocked tickets before creating new work.

Gates:
- select at most one bounded action per beat.
- no separate ticket-drainer automation is required.
- substantial implementation routes through $harness-creator first when the operating model is missing, then $goal-advisor only after a concrete milestone exists.
- no push, deploy, publish, spend, account changes, external mutation, or destructive cleanup.
- no shady growth, fake engagement, privacy-invasive analytics, or content that misrepresents what agents or Farplane did.
- no drift review, broad strategy replanning, or unbounded worker spawning.

Final output:
- execution mode
- reward updates
- child thread IDs or planning request
- report/state paths
- evidence that will decide the next reward update
'''

[automations.target]
thread_id = "019ef4a0-5f28-7f51-b682-a44114bf2b0b"

[automations.schedule]
type = "interval"
interval_minutes = 30

[[automations]]
id = "farplane-ui-daily-interval"
name = "Farplane UI Daily Interval"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run the Farplane UI Daily Interval.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane-UI"
interval_id = "daily_interval"
review_window = "last_24h"
planning_window = "next_24h"
timezone = "Asia/Kuala_Lumpur"

Reads:
- latest weekly_interval report when it exists.
- farplane/harness.md
- farplane/products.md
- farplane/goals.md
- active tickets/TASK-*/ticket.md files

Runs:
- plan_progress: light
- goal_drift: light
- ticket_board_drift: light
- product_refill: when local ready work is thin
- distribution_refill: when there are no current content/demo tickets tied to viral agent-office or feature-showcase products

Gates:
- report before mutation.
- source gaps instead of guessed refs.
- no scheduler state writes.
- no push, deploy, publish, spend, external mutation, commit, unbounded worker spawning, or destructive cleanup.

Final output:
- dated report path
- next-24-hour plan
- Pulse guidance
- proposed ticket deltas or Goal Advisor handoffs
- approval-required goals delta, if any
'''

[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane-UI"

[automations.schedule]
type = "daily"
timezone = "Asia/Kuala_Lumpur"
time = "05:33"

[[automations]]
id = "farplane-ui-weekly-interval"
name = "Farplane UI Weekly Interval"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run the Farplane UI Weekly Interval.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane-UI"
interval_id = "weekly_interval"
review_window = "last_week"
planning_window = "next_week"
timezone = "Asia/Kuala_Lumpur"

Reads:
- all daily_interval reports inside last_week.
- farplane/harness.md
- farplane/products.md
- farplane/goals.md
- docs/bootstrap-brief.md
- active tickets

Runs:
- plan_progress: true
- codex_attention_drift: true
- ticket_board_drift: true
- feedback_obligations: when sources exist
- opportunity_signals: when sources exist
- goal_drift: true
- metric_snapshot: when sources exist
- compounding_leverage_review: true
- docs_consolidation: when sources exist
- priority_planning: true
- distribution_planning: true

Gates:
- report before mutation.
- approval required for static charter, north-star, KPI, strategy-axis, quarterly/yearly, durable milestone, and hold changes.
- urgent leverage escalation requires high confidence, explicit loss term, evidence refs, review-by date, and owner route.
- source gaps instead of guessed refs.
- no scheduler state writes.
- no shady growth, fake engagement, privacy-invasive analytics, or content that misrepresents what agents or Farplane did.
- no push, deploy, publish, spend, external mutation, commit, unbounded worker spawning, or destructive cleanup.

Final output:
- dated report path
- next-week plan
- lane distribution and ticket budget
- Pulse guidance
- proposed ticket deltas or Goal Advisor handoffs
- approval-required goals delta, if any
- leverage decisions and reward closure
'''

[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane-UI"

[automations.schedule]
type = "weekly"
timezone = "Asia/Kuala_Lumpur"
days = ["Mon"]
time = "05:45"
