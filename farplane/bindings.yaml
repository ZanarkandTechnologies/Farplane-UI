kind: project-bindings
status: active
created_at: 2026-06-17
updated_at: 2026-07-12
framework_template_version: "0.4.0"
owner: project-pm-automation
project:
  id: farplane-ui
  name: Farplane UI
  root: /Users/kenjipcx/Zanarkand Technologies/projects/Farplane-UI
human_gates:
  - post
  - publish
  - spend
  - deploy
  - external_contact
  - account_mutation
  - destructive_cleanup
integrations:
  github:
    repo: null
    remote: null
    default_branch: main
    source_gap: repository provider is not configured as a tracked metric source.
  notion:
    project_name: null
    project_page_url: null
    task_database_alias: null
    write_policy: local_first
  posthog:
    project_id: null
    host: null
    dashboard_url: null
    source_gap: activation instrumentation is deferred until top-of-funnel evidence exists.
  vercel:
    project_id: null
    project_url: null
    production_url: null
  workos:
    tenant_alias: null
    dashboard_url: null
kanban:
  provider: filesystem_tickets
  tickets_dir: tickets
  archive_dir: tickets/archive
  write_policy: read_only_ui
  poll_seconds: 60
content:
  ledger: .farplane/content/ledger.jsonl
  evidence_required: accepted_ui_workflows_releases
  composition_route:
    - content-impl-plan
    - storyboard
    - social-content
    - video-production
    - remotion
    - qa
  publish_policy: approval_required
feed_scout:
  enabled: false
  source_gap: No Farplane UI-specific feed scout source list has been approved yet.
  report_root: .farplane/reports/feed-scout
  latest_report: .farplane/reports/feed-scout/latest.json
  daily_feed_root: .farplane/feed-scout/daily
  ledger: .farplane/feed-scout/ledger.jsonl
  proposal_ledger: .farplane/feed-scout/proposals.jsonl
  destination: local_ledger
  write_policy: local_first
metric_bindings:
  accepted_ui_product_cycles:
    refresh: >-
      Count completed tickets under tickets/ and tickets/archive/ whose Done /
      Proof identifies one selected Farplane UI product from harness.yaml and
      includes accepted evidence plus QA or reviewer signal. Store product ID,
      ticket refs, proof refs, and residual risk in the observation payload.
  accepted_ui_workflows_releases:
    refresh: >-
      Count completed tickets under tickets/ and tickets/archive/ whose Done /
      Proof or review evidence explicitly accepts a Farplane UI workflow or
      release. Store ticket refs, proof refs, QA refs, and reviewer verdicts in
      the observation payload; return source_gap when acceptance evidence is
      absent.
  evidence_distribution_reach:
    refresh: >-
      Select content ledger rows whose source evidence references an accepted
      UI workflow/release. Sum available same-window X, Instagram, GitHub, or
      manual ledger reach readings; store source_gap when no provider or
      manual reading exists.
  decision_changing_adoption_briefs:
    refresh: >-
      Count completed adoption briefs in tickets, reports, or accepted
      research artifacts whose proof names the decision changed, evidence refs,
      confidence, and next action or no-action result.
  qualified_install_interest_signal:
    refresh: >-
      Source gap until a manual ledger, GitHub/analytics provider, or approved
      customer-interest capture route exists. Do not select this metric as a
      planner objective before then.
event_routes:
  farplane.config.changed:
    program: config_projection_refresh
    source: farplane/hooks.json
