kind: project-metrics
status: active
created_at: 2026-07-12
updated_at: 2026-07-19
framework_template_version: "0.3.0"
owner: metric-advisor
finance:
  currency: USD
  expense_limit:
    amount: 400
    window: calendar_month
metrics:
  ai_spend:
    label: AI spend
    description: >-
      Actual AI-related spend recorded as one USD amount per calendar day.
      Refreshes replace the reading for that date instead of adding a duplicate.
    pinned: false
    kind: daily_count
    unit: usd
    display: bar_plus_cumulative
    direction: minimize
    max_age_days: 7
    finance:
      flow: expense
      basis: actual
  accepted_ui_product_cycles:
    label: Accepted UI product cycles
    description: >-
      Daily count of completed tickets whose proof advances one selected
      Farplane UI descriptive product and names accepted evidence, reviewer or
      QA signal, and residual risk.
    pinned: true
    kind: daily_count
    unit: cycles
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 7
  accepted_ui_workflows_releases:
    label: Accepted UI workflows/releases
    description: >-
      Daily count of completed Farplane UI tickets whose proof shows a
      reviewed local UI workflow or release accepted through ticket Done /
      Proof, QA, and review evidence.
    pinned: false
    kind: daily_count
    unit: workflows
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 7
  evidence_distribution_reach:
    label: Evidence distribution reach
    description: >-
      Same-window reach for demos or content that name accepted Farplane UI
      evidence in their source packet. Platform components stay in the
      observation payload, and missing access is recorded as a source gap.
    pinned: false
    kind: daily_count
    unit: views
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 7
  decision_changing_adoption_briefs:
    label: Decision-changing adoption briefs
    description: >-
      Daily count of adoption, user, or market learning briefs whose evidence
      changes a product, workflow, positioning, distribution, or no-action
      decision for Farplane UI.
    pinned: false
    kind: daily_count
    unit: briefs
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 14
  qualified_install_interest_signal:
    label: Qualified install/interest signal
    description: >-
      Qualified install, clone, access, or "how do I try this?" interest
      attributable to Farplane UI evidence. This is intentionally unselected
      until an honest provider or manual ledger exists.
    pinned: false
    kind: daily_count
    unit: signals
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 14
